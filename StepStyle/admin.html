<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | StepStyle</title><link rel="stylesheet" href="css/styles.css"><style>
.admin-wrap{max-width:1200px;margin:auto;padding:40px 24px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.admin-stat,.admin-panel{background:#fff;border:1px solid #ddd;padding:20px}.admin-stat strong{font-size:30px;display:block}.admin-panel{margin:20px 0;overflow:auto}.admin-panel h2{margin-top:0}.admin-table{width:100%;border-collapse:collapse;font-size:13px}.admin-table th,.admin-table td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.admin-table select,.admin-panel input,.admin-panel textarea{padding:9px;border:1px solid #ccc;max-width:100%}.admin-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.admin-form label{display:grid;gap:5px;font-size:12px}.admin-form .wide{grid-column:span 2}.admin-message{padding:10px;background:#eee;margin:10px 0}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap}.admin-tabs button{padding:10px 16px;border:1px solid #111;background:#fff}.admin-tabs button.active{background:#111;color:#fff}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin-form{grid-template-columns:1fr 1fr}}
</style></head><body><div id="siteHeader"></div><main class="admin-wrap"><div id="adminApp"><p>Verificando permisos...</p></div></main><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script></body></html>
