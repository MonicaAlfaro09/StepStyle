<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | StepStyle</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div class="shell checkout-shell"><div class="page-heading"><p class="kicker">FINALIZAR COMPRA</p><h1>Checkout</h1><div class="stepper"><span class="active" data-step-dot="1">1 Dirección</span><span data-step-dot="2">2 Pago</span><span data-step-dot="3">3 Revisar</span></div></div><div class="checkout-layout"><section class="checkout-panel"><form id="checkoutForm" novalidate><div class="checkout-step active" data-step="1"><h2>Dirección de envío</h2><div class="form-grid"><label>Nombre completo<input name="fullName" required></label><label>Correo<input name="email" type="email" required></label><label class="span-2">Dirección<input name="address" required></label><label>Ciudad<input name="city" required></label><label>Estado<input name="state" required></label><label>Código postal<input name="zip" inputmode="numeric" pattern="\d{5}" maxlength="5" required></label><label>Teléfono<input name="phone" inputmode="tel" pattern="[0-9+() -]{10,}" required></label></div><div id="shippingStatus" class="shipping-status">Ingresa un código postal de 5 dígitos para calcular el envío.</div><button type="button" class="button button-dark" data-next="2">Continuar a pago</button></div><div class="checkout-step" data-step="2"><h2>Método de pago</h2><div class="payment-methods"><label><input type="radio" name="payment" value="Tarjeta" checked> Tarjeta</label><label><input type="radio" name="payment" value="Transferencia"> Transferencia</label><label><input type="radio" name="payment" value="PayPal"> PayPal</label></div><div id="cardFields" class="form-grid"><label class="span-2">Número de tarjeta<input name="card" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19"></label><label>Vencimiento<input name="expiry" placeholder="MM/AA" maxlength="5"></label><label>CVV<input name="cvv" inputmode="numeric" maxlength="4"></label></div><div class="step-buttons"><button type="button" class="button button-outline" data-prev="1">Atrás</button><button type="button" class="button button-dark" data-next="3">Revisar compra</button></div></div><div class="checkout-step" data-step="3"><h2>Revisa tu pedido</h2><div id="reviewInfo"></div><div class="step-buttons"><button type="button" class="button button-outline" data-prev="2">Atrás</button><button type="submit" class="button button-dark" id="payButton">Confirmar pago</button></div></div><div id="checkoutError" class="form-error"></div></form></section><aside class="summary-card checkout-summary"><h2>Resumen</h2><div id="checkoutItems"></div><div class="coupon-box"><input id="couponCode" placeholder="Código promocional"><button id="applyCoupon" class="button button-outline compact" type="button">Aplicar</button><small>Prueba PROFE100 o STEP20.</small></div><div class="summary-line"><span>Subtotal</span><strong id="sumSubtotal"></strong></div><div class="summary-line"><span>Descuento</span><strong id="sumDiscount">$0</strong></div><div class="summary-line"><span>Envío</span><strong id="sumShipping">Por calcular</strong></div><div class="summary-line"><span>IVA 16%</span><strong id="sumTax"></strong></div><div class="summary-line total"><span>Total</span><strong id="sumTotal"></strong></div></aside></div></div></main><div class="processing" id="processing"><div class="spinner"></div><strong>Procesando pago...</strong></div><div id="siteFooter"></div><script src="js/products.js"></script><script src="js/common.js"></script><script src="js/checkout.js"></script></body></html>
